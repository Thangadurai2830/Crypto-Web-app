# AlertManager — notifications (email, Slack, etc.)
global:
  # smtp_smarthost: 'smtp.example.com:587'
  # smtp_from: 'alerts@example.com'

route:
  receiver: "default"
  group_by: ["alertname", "job"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  routes:
    # - match:
    #     severity: critical
    #   receiver: "critical"
    # - match:
    #     severity: warning
    #   receiver: "warning"

receivers:
  - name: "default"
    # Placeholder: add your notification target
    # webhook_configs:
    #   - url: "http://example.com/webhook"
    # email_configs:
    #   - to: "ops@example.com"
    # slack_configs:
    #   - api_url: "https://hooks.slack.com/..."
    #     channel: "#alerts"

  # - name: "critical"
  #   ...
  # - name: "warning"
  #   ...

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname", "job"]
